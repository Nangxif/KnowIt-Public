    <script>

          theme = "vscode-light";
        } else if (themeParam === "dark" || themeParam === "vscode-dark") {
          theme = "vscode-dark";

        var locale = null;
        if (path === "/en" || path.indexOf("/en/") === 0) {
          locale = "en-US";
        } else if (path === "/zh-TW" || path.indexOf("/zh-TW/") === 0) {
          locale = "zh-TW";
        } else if (
          localeParam === "zh-CN" ||
          localeParam === "zh" ||
          localeParam === "zh-cn" ||
          localeParam === "cn"

          locale = "zh-CN";
        } else if (
          localeParam === "zh-TW" ||
          localeParam === "zh-tw" ||
          localeParam === "tw"
        ) {
          locale = "zh-TW";
        } else if (
          localeParam === "en-US" ||
          localeParam === "en" ||
          localeParam === "en-us"
        ) {
          locale = "en-US";
        } else {
          locale = "zh-CN";
        }
        if (locale === "zh-CN" || locale === "zh-TW" || locale === "en-US") {
          document.documentElement.lang = locale === "en-US" ? "en" : locale;
