          theme = "vscode-light";

        if (path === "/en" || path.indexOf("/en/") === 0) {

          locale = "zh-TW";

          localeParam === "tw"

          locale = "zh-TW";
        } else if (
          localeParam === "en-US" ||
          localeParam === "en" ||
          localeParam === "en-us"
        ) {
          locale = "en-US";
        } else {
          locale = "zh-CN";
        }
        if (locale === "zh-CN" || locale === "zh-TW" || locale === "en-US") {
