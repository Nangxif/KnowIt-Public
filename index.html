<!doctype html>
<html lang="zh-CN" data-knowit-theme="vscode-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/icon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KnowIt 是开源、模块化、隐私优先的网页阅读扩展。支持页内文字查找、划词翻译、AI 总结和正文导出。页面内容默认只在本地处理。"
    />
    <title>KnowIt — 页内查找、划词翻译与 AI 总结的浏览器扩展</title>
    <script>
      try {
        var params = new URLSearchParams(location.search);
        var themeParam = params.get("theme");
        var theme = localStorage.getItem("knowItTheme");
        if (themeParam === "light" || themeParam === "vscode-light") {
          theme = "vscode-light";
        } else if (themeParam === "dark" || themeParam === "vscode-dark") {
          theme = "vscode-dark";
        }
        if (theme === "vscode-dark" || theme === "vscode-light") {
          document.documentElement.dataset.knowitTheme = theme;
          document.documentElement.style.colorScheme =
            theme === "vscode-dark" ? "dark" : "light";
        }
        var path = location.pathname;
        var localeParam = params.get("lang");
        var locale = null;
        if (path === "/en" || path.indexOf("/en/") === 0) {
          locale = "en-US";
        } else if (path === "/zh-TW" || path.indexOf("/zh-TW/") === 0) {
          locale = "zh-TW";
        } else if (
          localeParam === "zh-CN" ||
          localeParam === "zh" ||
          localeParam === "zh-cn" ||
          localeParam === "cn"
        ) {
          locale = "zh-CN";
        } else if (
          localeParam === "zh-TW" ||
          localeParam === "zh-tw" ||
          localeParam === "tw"
        ) {
          locale = "zh-TW";
        } else if (
          localeParam === "en-US" ||
          localeParam === "en" ||
          localeParam === "en-us"
        ) {
          locale = "en-US";
        } else {
          locale = "zh-CN";
        }
        if (locale === "zh-CN" || locale === "zh-TW" || locale === "en-US") {
          document.documentElement.lang = locale === "en-US" ? "en" : locale;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
